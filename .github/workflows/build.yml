# Builds TaskbarMedia.exe on every push, and attaches it to a release when one
# is published on GitHub.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release --locked

      - name: Keep the exe as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskbarMedia
          path: target/release/TaskbarMedia.exe

      - name: Attach the exe to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" target/release/TaskbarMedia.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
