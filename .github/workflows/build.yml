# Builds TaskbarMedia.exe on every push, and attaches it to a release when one
# is published on GitHub. Can also be run by hand from the Actions tab to
# rebuild a release's exe: enter the release tag when asked.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild and re-attach the exe to (for example v1.1.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build
        run: cargo build --release --locked

      - name: Keep the exe as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskbarMedia
          path: target/release/TaskbarMedia.exe

      - name: Attach the exe to the release
        if: github.event_name == 'release' || inputs.tag != ''
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" target/release/TaskbarMedia.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}