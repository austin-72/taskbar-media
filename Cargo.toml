[package]
name = "taskbar-media"
license = "MIT"
description = "Now-playing widget for the Windows taskbar"
version = "1.8.0"
edition = "2021"

[[bin]]
name = "TaskbarMedia"
path = "src/main.rs"

[dependencies]
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_Packaging_Appx", "Win32_System_SystemInformation", "Win32_Storage_EnhancedStorage", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_Security", "Win32_System_ApplicationInstallationAndServicing", "Win32_UI_Controls", "Win32_System_Ole", "Media", "Win32_Media_Audio", "Win32_System_DataExchange", "Win32_System_Memory", "Web_Http", "Web_Http_Headers", "Win32_UI_Controls_Dialogs", "Win32_Media_Audio_Endpoints", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3.0.12"
